[package]
name        = "haiku-harness"
version     = "1.0.0"
edition     = "2021"
description = "Universal constraint-driven orchestration harness for Haiku 3.x and 4.x"
license     = "LicenseRef-SnapKitty-Proprietary"
authors     = ["SnapKitty Sovereign Systems"]

[[example]]
name = "haiku3_dispatch"

[[example]]
name = "multi_agent_coordination"

[dependencies]
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
quick-xml   = { version = "0.31", features = ["serialize"] }
sha2        = "0.10"
hex         = "0.4"
tokio       = { version = "1", features = ["full"] }
uuid        = { version = "1", features = ["v4"] }
anyhow      = "1"
aws-config  = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"

[dev-dependencies]
tokio       = { version = "1", features = ["full", "test-util"] }
